<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PinMapper has moved</title>
  <meta name="description" content="PinMapper has moved to Everpin.">
  <meta http-equiv="refresh" content="0; url=https://everpinmap.com">
  <link rel="canonical" href="https://everpinmap.com">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/main_icon.png">
  <script>location.replace("https://everpinmap.com");</script>
  <style>
    :root { --gold: #FFD046; --bg: #050505; --muted: rgba(255,255,255,0.58); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1a1508 0%, var(--bg) 55%);
      color: #f5f5f5;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }
    h1 { font-size: 2em; margin: 0 0 10px; letter-spacing: -0.5px; }
    p { color: var(--muted); margin: 0 0 22px; line-height: 1.5; }
    a {
      color: #050505;
      background: var(--gold);
      text-decoration: none;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 999px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <main>
    <h1>PinMapper has moved</h1>
    <p>This app is shutting down. Continue at Everpin.</p>
    <a href="https://everpinmap.com">Go to everpinmap.com</a>
  </main>
</body>
</html>
